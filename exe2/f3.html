<!DOCTYPE html>
<html>
<head>
<title>Student Registration Form</title>
</head>

<body>
<h1 align="center">Student Registration Form</h1>
<form>
<table border="1" cellpadding="8" cellspacing="5" align="center">
<tr>
<td><b>Full Name</b></td>
<td>
<input type="text" name="name" placeholder="Enter your
name">
</td>
</tr>

<tr>
<td><b>Password</b></td>
<td>



<input type="password" name="password"
placeholder="Enter password">
</td>
</tr>

<tr>
<td><b>Mobile Number</b></td>
<td>
<input type="number" name="mobile" placeholder="Enter
mobile number">
</td>
</tr>

<tr>
<td><b>Date of Birth</b></td>
<td>
<input type="date" name="dob">
</td>
</tr>

<tr>
<td><b>Gender</b></td>
<td>
<input type="radio" name="gender" value="male"> Male
<input type="radio" name="gender" value="female">
Female
<input type="radio" name="gender" value="other"> Other
</td>
</tr>

<tr>
<td><b>Skills</b></td>
<td>
<input type="checkbox" name="skill" value="html"> HTML
<input type="checkbox" name="skill" value="css"> CSS
<input type="checkbox" name="skill" value="java"> Java


<input type="checkbox" name="skill" value="python">
Python
</td>
</tr>

<tr>
<td><b>Select Course</b></td>
<td>
<select name="course">
<option value="">-- Select Course --</option>
<option value="IT">Information Technology</option>
<option value="CSE">Computer Science</option>
<option value="ECE">Electronics and
Communication</option>
<option value="EEE">Electrical Engineering</option>
</select>
</td>
</tr>

<tr>
<td><b>Address</b></td>
<td>
<textarea name="address" rows="5" cols="30"
placeholder="Enter your address"></textarea>
</td>
</tr>

<tr>
<td colspan="2" align="center">
<input type="submit" value="Submit">
<input type="reset" value="Reset">
</td>
</tr>
</table>
</form>

</body>
</html>
