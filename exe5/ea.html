<!DOCTYPE html>
<html>
<head>
    <title>Different Ways to Specify Colors in CSS</title>

    <style>
        /* 1. Color Name */
        h1 {
            color: red;
        }

        /* 2. HEX Color */
        .hex {
            color: #0000ff;
        }

        /* 3. RGB Color */
        .rgb {
            color: rgb(0, 128, 0);
        }

        /* 4. RGBA Color */
        .rgba {
            background-color: rgba(255, 0, 0, 0.5);
            padding: 20px;
        }

        /* 5. HSL Color */
        .hsl {
            color: hsl(280, 100%, 50%);
        }

        /* 6. HSLA Color */
        .hsla {
            background-color: hsla(200, 100%, 50%, 0.5);
            padding: 20px;
        }
    </style>
</head>

<body>

    <h1>CSS Color References</h1>

    <p class="hex">This text uses HEX color.</p>

    <p class="rgb">This text uses RGB color.</p>

    <div class="rgba">
        This box uses RGBA color with transparency.
    </div>

    <p class="hsl">This text uses HSL color.</p>

    <div class="hsla">
        This box uses HSLA color with transparency.
    </div>

</body>
</html>
