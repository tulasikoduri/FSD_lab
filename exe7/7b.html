<!DOCTYPE html>
<html>
<head>
    <title>Window Object Example</title>
</head>
<body>

<h2>JavaScript Window Object</h2>

<button onclick="showDetails()">Show Window Details</button>
<button onclick="openPage()">Open Page</button>
<button onclick="closePage()">Close Window</button>

<p id="output"></p>

<script>
function showDetails() {
    let details =
        "Window Width: " + window.innerWidth + " px<br>" +
        "Window Height: " + window.innerHeight + " px<br>" +
        "URL: " + window.location.href + "<br>" +
        "Browser: " + window.navigator.userAgent;

    document.getElementById("output").innerHTML = details;

    window.alert("Window details displayed!");
}

function openPage() {
    window.open("https://www.google.com", "_blank");
}

function closePage() {
    window.close();
}
</script>

</body>
</html>
