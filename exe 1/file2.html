<!DOCTYPE html> 
<html> 
<head> 
 <title>HTML Hyperlinks</title> 
</head> 
<body> 
 <h1>Working of Hyperlinks</h1> 
 <h2>1. Basic Hyperlink</h2>
 
 <a href="https://www.google.com"> 
 Open Google 
 </a> 
 <h2>2. Hyperlink with Target = "_blank"</h2> 
 <a href="https://www.youtube.com" target="_blank">  Open YouTube in New Tab 
 </a> 
 <h2>3. Hyperlink with Target = "_self"</h2> 
 <a href="https://www.wikipedia.org" target="_self">  Open Wikipedia in Same Tab 
 </a> 
 <h2>4. Hyperlink to Another Page</h2> 
 <a href="about.html" target="_blank"> 
 Open About Page 
 </a> 
</body> 
</html>
